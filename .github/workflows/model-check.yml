   name: Model check

   on:
     push:
     pull_request:

   jobs:
     check:
       runs-on: ubuntu-latest
       steps:
         - uses: actions/checkout@v4
         - uses: actions/setup-python@v5
           with:
             python-version: "3.12"
         - name: Unit tests for the checker
           run: python -m unittest discover tests
         - name: Check the SysML v2 model
           run: python tools/model_check.py BenchtopImager.sysml --out reports
